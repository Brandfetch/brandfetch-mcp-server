[project]
name = "brandfetch-mcp-server"
version = "1.2.2"
description = "Brandfetch MCP Server - Brand data for AI assistants"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
